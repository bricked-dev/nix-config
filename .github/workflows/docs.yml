name: "Deploy documentation"

on:
  push:

concurrency:
  cancel-in-progress: true
  group: pages

env:
  EXTRA_NIX_CONFIG: |
    experimental-features = nix-command flakes pipe-operators
    substituters = https://cache.nixos.org https://nix-community.cachix.org https://bricked.cachix.org
    trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= bricked.cachix.org-1:SPpNjrCYzlfisekwWTN7dEUQs+OrirrM92h1ZoEnciY=

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v5
      - name: Claim disk space
        uses: wimpysworld/nothing-but-nix@main
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "${{ env.EXTRA_NIX_CONFIG }}"
      - name: Build documentation
        run: nix build .#nix-config-docs
      - name: Upload documentation
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./result/share/doc/nix-config/html

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      pages: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5
