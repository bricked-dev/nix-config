name: "Build Flake outputs"

on:
  push:

env:
  EXTRA_NIX_CONFIG: |
    experimental-features = nix-command flakes pipe-operators
    substituters = https://cache.nixos.org https://nix-community.cachix.org https://bricked.cachix.org
    trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= bricked.cachix.org-1:SPpNjrCYzlfisekwWTN7dEUQs+OrirrM92h1ZoEnciY=

jobs:
  build_dev_shell:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v5
      - name: Claim disk space
        uses: wimpysworld/nothing-but-nix@main
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "${{ env.EXTRA_NIX_CONFIG }}"
      - name: Build default dev shell
        run: >
          nix run github:Mic92/nix-fast-build --
          --cachix-cache bricked
          --skip-cached
          --no-nom
          --flake ".#devShells.x86_64-linux.default"
        env:
          CACHIX_AUTH_TOKEN: "${{ secrets.CACHIX_AUTH_TOKEN }}"

  build_nixos:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v5
      - name: Claim disk space
        uses: wimpysworld/nothing-but-nix@main
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "${{ env.EXTRA_NIX_CONFIG }}"
      - name: Build NixOS configuration for Carrot
        run: >
          nix run github:Mic92/nix-fast-build --
          --cachix-cache bricked
          --skip-cached
          --no-nom
          --flake ".#legacyPackages.x86_64-linux.nixosConfigurations.carrot.config.system.build.toplevel"
        env:
          CACHIX_AUTH_TOKEN: "${{ secrets.CACHIX_AUTH_TOKEN }}"

  build_home:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v5
      - name: Claim disk space
        uses: wimpysworld/nothing-but-nix@main
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "${{ env.EXTRA_NIX_CONFIG }}"
      - name: Build Home Manager configuration for Bricked on Carrot
        run: >
          nix run github:Mic92/nix-fast-build -- 
          --cachix-cache bricked
          --skip-cached
          --no-nom
          --flake ".#legacyPackages.x86_64-linux.homeConfigurations.\"bricked@carrot\".activationPackage"
        env:
          CACHIX_AUTH_TOKEN: "${{ secrets.CACHIX_AUTH_TOKEN }}"
